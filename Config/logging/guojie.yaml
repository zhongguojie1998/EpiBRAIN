# logging setup

exp_name: debug  # experiment name, used to create the log directory and checkpoint directory

## overall logging setup
log_level: DEBUG  # logging level, INFO, DEBUG, etc.
log_dir: ./logs/${logging.exp_name}  # if null/not provided, otput the logs to the console, if provided, output the logs to the file
write_log_to_file: True  # whether to output the logs to the file, if True, will output the logs to the file
overwrite_log_file: True  # whether to overwrite the log file, if True, will overwrite the existing log file
use_tensorboard: True  # whether to use tensorboard to log the training process, if True, will log the training process to tensorboard

## training logging setup
checkpoint_dir: ./Chk.guojie/${logging.exp_name}  # directory to save the checkpoints
res_dir: ./Res.guojie/${logging.exp_name}
save_every: 2
report_every: 1
log_more: True