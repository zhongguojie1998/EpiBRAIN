# full precision Model Setup, no flashatten and autocast
defaults:
  - flashzoi_enformer_style

model_name: johahi/borzoi-replicate-0 # 'johahi/borzoi-replicate-[0-3]'

## technical setup
flashed: True  # whether to use FlashAttention, in finetune setting, we should disable this
use_autocast: True  # whether to use autocast, if using FlashAttention, always set to True, else, default as False

## fine tune setting

## Available finetune_method
### `lora`: low rank approximation, adding some trainable layers to the model and fix the rest (using peft LoraConfig)
### `finetune_layers`: provide some trainable layers and only train these layers
### `cont_from_pretrain`: just load the parameters from the pretrained model and continue training 
finetune_method: cont_from_pretrain 

partial_load:
  - conv_dna
  - res_tower
  - unet1
  - horizontal_conv