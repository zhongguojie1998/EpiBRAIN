defaults:
  - default

storage_path: ./Data/enformer_style_split_data_v5 # where to store the data embedding, now only support precomputed version

preprocess:
  trial_summary_path: ./Data/data_config/data_v5.csv # path to the trials (label), only support bigwig files
  gap_bed: ./Data/source/hg38_unmap_macro.bed # if provided, delete all the reads from gap regions so that they are not included in the datasets

  unmap_bed: ./Data/source/umap_k36_t10_l32.bed # if provided, delete reads with too many unmap regions so that they are not included in the datasets
  unmap_threshold: 0.5 # the threshold to filter the unmap regions, if unmap_bed is provided, remove sequences with more than this unmappable bin percentile (should be between 0 and 1)

  blacklist_bed: ./Data/source/blacklist_hg38_all.bed # if provided, set all the reads value from blacklist regions to within the baseline value