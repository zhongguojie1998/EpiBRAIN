defaults:
  - default

storage_path: ./Data/lc_HM_ATAC_v1 # where to store the data embedding, now only support precomputed version
context_length: 524_288
preload_data: False

preprocess:

  trial_summary_path: ./Data/data_config/HM_ATAC_v1.csv # path to the trials (label), only support bigwig files

  break_threshold: 3_145_728

  stride_train: 174_775 # ~ 524288 /3 + 13 to shift the bin
  stride_test: 522_253 # ~ 524288 - 2 * (524288-16320*32) / 2 + 13 to shift the bin, ensure the testing region is not overlapped

  window_size: 32
  n_window: 16320

